<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto', sans-serif;
  width: 100vw;
  height: 100vh;
  background: #fcfcfc; /* Off-white for comic book feel */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 6vw;
  color: #111;
  overflow: hidden;
}

.slide-content {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-family: 'Ultra', serif;
  font-size: 3vw;
  font-weight: normal;
  text-align: center;
  color: #111;
  margin-bottom: 3vw;
}

.subtitle {
  font-size: 1.2vw;
  color: #555;
  margin-bottom: 3vw;
  text-align: center;
  font-style: italic;
}

/* Manga Strip Layout */
.manga-container {
  display: flex;
  gap: 1vw;
  width: 100%;
  justify-content: center;
  margin-bottom: 4vw;
}

.manga-panel {
  flex: 1;
  max-width: 28vw;
  background: #fff;
  border: 0.2vw solid #111;
  box-shadow: 0.5vw 0.5vw 0 #111;
  border-radius: 0.3vw;
  overflow: hidden;
  position: relative;
  transition: transform 0.3s ease;
}

.manga-panel:hover {
  transform: translate(-0.2vw, -0.2vw);
  box-shadow: 0.7vw 0.7vw 0 #111;
}

.manga-panel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ── Spread Mode Adjustments ── */
body.spread-mode .manga-container {
  gap: 2vw;
}
body.spread-mode .manga-panel {
  border: 0.3vw solid #111;
  box-shadow: 0.8vw 0.8vw 0 #111;
}
body.spread-mode h1 {
  font-size: 3.5vw;
}

</style>
<link href="https://fonts.googleapis.com/css2?family=Ultra&display=swap" rel="stylesheet">
<style>
  .title, .title-main, .title-sub, h1, h2, .intro-text {
    font-family: 'Ultra', serif !important;
    font-weight: normal !important;
  }
</style>
</head>
<body>

<div class="slide-content">
  
  <h1>The Biographer Has Opened Its Eyes.</h1>

  <div class="manga-container">
    <div class="manga-panel">
      <img src="../assets/img/manga/1.png" alt="Manga Panel 1">
    </div>
    <div class="manga-panel">
      <img src="../assets/img/manga/2.png" alt="Manga Panel 2">
    </div>
    <div class="manga-panel">
      <img src="../assets/img/manga/3.png" alt="Manga Panel 3">
    </div>
  </div>

</div>

</body>
</html>
