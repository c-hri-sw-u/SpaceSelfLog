<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  width: 100vw;
  height: 100vh;
  background: #ffffff;
  color: #111111;
  padding: 4vw 6vw;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slide-container {
  width: 100%;
  max-height: 100%;
}
h1 {
  font-size: 2.5vw;
  font-weight: 700;
  margin-bottom: 1.5vw;
  color: #000000;
  border-bottom: 2px solid #eaeaea;
  padding-bottom: 0.5vw;
}
.content-columns {
  column-count: 2;
  column-gap: 4vw;
}
.prompt-section {
  margin-bottom: 1.2vw;
  break-inside: avoid;
}
h2 {
  font-size: 1.1vw;
  font-weight: 700;
  margin-bottom: 0.6vw;
  color: #222;
}
.prompt-text {
  font-family: 'Fira Code', monospace;
  font-size: 0.75vw;
  line-height: 1.35;
  color: #333;
  background: #f5f5f5;
  padding: 1vw;
  border-radius: 4px;
  white-space: pre-wrap;
  word-wrap: break-word;
  border: 1px solid #e0e0e0;
}
</style>
</head>
<body>
  <div class="slide-container">
    <h1>System Prompts (1/2)</h1>
    <div class="content-columns">
      
      <div class="prompt-section">
        <h2>VLM Prompt (Per-Batch)</h2>
        <div class="prompt-text" id="p-prompt">Loading...</div>
      </div>
      
      <div class="prompt-section">
        <h2>Incremental Prompt</h2>
        <div class="prompt-text" id="p-incremental">Loading...</div>
      </div>
      
      <div class="prompt-section">
        <h2>Consolidation Prompt</h2>
        <div class="prompt-text" id="p-consolidation">Loading...</div>
      </div>

    </div>
  </div>

  <script>
    fetch('/api/config')
      .then(r => r.json())
      .then(data => {
        if (data.prompt) document.getElementById('p-prompt').textContent = data.prompt;
        if (data.incremental_prompt) document.getElementById('p-incremental').textContent = data.incremental_prompt;
        if (data.consolidation_prompt) document.getElementById('p-consolidation').textContent = data.consolidation_prompt;
      })
      .catch(err => {
        console.error("Failed to load config:", err);
      });
  </script>
</body>
</html>
