<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto', sans-serif;
  width: 100vw;
  height: 100vh;
  background: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.visual-container {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.cyber-lobster {
  width: 80vw;
  max-height: 80vh;
  object-fit: contain;
  opacity: 1;
}

.title-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 20;
}

.title-main {
  font-size: 8vw;
  color: #111;
  text-transform: uppercase;
}

.byline {
  position: absolute;
  bottom: 10%;
  font-size: 1.6vw;
  font-weight: 300;
  color: #888;
  letter-spacing: 0.08em;
}

.highlight {
  background: #ffe94d;
  padding: 0 0.15em;
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ultra&display=swap" rel="stylesheet">
<style>
  .title-main, .title-sub, h1, h2 {
    font-family: 'Ultra', serif !important;
    font-weight: normal !important;
  }
</style>
</head>
<body>

<div class="visual-container">
  <img src="../assets/img/cyber_lobster_transparent.png" alt="Cyber Lobster" class="cyber-lobster">
</div>

<div class="byline">Chris Wu &nbsp;&nbsp; 2026</div>

</body>
</html>
