<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  width: 100vw;
  height: 100vh;
  background: #ffffff;
  color: #111111;
  padding: 4vw 6vw;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slide-container {
  width: 100%;
  max-height: 100%;
  display: flex;
  flex-direction: column;
}
h1 {
  font-size: 2.5vw;
  font-weight: 700;
  margin-bottom: 1.5vw;
  color: #000000;
  border-bottom: 2px solid #eaeaea;
  padding-bottom: 0.5vw;
}
.content-area {
  display: flex;
  gap: 4vw;
  flex: 1;
  align-items: center;
}
.col {
  flex: 1;
}
.frame-placeholder, .frame-image {
  width: 100%;
  aspect-ratio: 4/3;
  background: #111;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin-bottom: 1vw;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  font-size: 1vw;
  border: 1px solid #333;
  object-fit: contain;
}
.frame-image {
  display: none;
  background: #000;
}
.caption {
  font-size: 0.85vw;
  color: #666;
  text-align: center;
  margin-bottom: 1.5vw;
}
pre {
  font-family: 'Fira Code', monospace;
  font-size: 0.85vw;
  line-height: 1.45;
  color: #d4d4d4;
  background: #1e1e1e;
  padding: 2vw;
  border-radius: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  max-height: 60vh;
}
</style>
</head>
<body>
  <div class="slide-container">
    <h1>Raw Data Log Example (Live)</h1>
    <div class="content-area">
      <div class="col" style="flex: 0.8;">
        <div id="framePlaceholder" class="frame-placeholder">
          Loading frame...
        </div>
        <img id="frameImage" class="frame-image" alt="Captured Frame">
        <div id="frameCaption" class="caption">Egocentric Camera Capture Frame</div>
      </div>
      <div class="col" style="flex: 1.2;">
        <pre><code id="jsonCode">Loading JSON...</code></pre>
      </div>
    </div>
  </div>

  <script>
    const fallbackJSON = {
      "activity": "organizing meal prep containers",
      "location": "home kitchen",
      "objects": [
        "glass meal prep container with layered food",
        "clear glasses",
        "wooden spice rack",
        "silicone utensil holder"
      ],
      "social_context": "alone",
      "notable_events": [
        "transition from dishwashing task to food storage organization",
        "sustained hand manipulation of container"
      ],
      "observation": "The user’s focus shifted from dishwasher loading to the organization of a glass meal prep container, shown in mid-motion as they placed it back into a wooden spice rack shelf. The layered food inside the container—visible under moderate indoor lighting—indicated a deliberate practice of pre-portioned meals, likely aligning with meal-prepping habits established in earlier sessions. A clear glass remained within arm’s reach, suggesting secondary cleanup or rinse support, while the silicone utensil holder’s presence reinforced the continuation of kitchen reset routines. The absence of motion and speech in this frame underscored a moment of intentional stillness amid post-meal activities, revealing the user’s tendency to methodically finalize kitchen states even as priorities subtly shift between cleanup and preparedness."
    };
    const fallbackImgUrl = '/api/frames/2026-04-30_11-25-50/2026-04-30T18-15-21Z/00_01005.jpg';

    fetch('/api/batches')
      .then(r => r.json())
      .then(batches => {
        const batch = batches.find(b => b.status === 'ok' && b.summary && b.filenames && b.filenames.length > 0);
        
        let imgUrl = fallbackImgUrl;
        let jsonData = fallbackJSON;
        let isLive = false;

        if (batch) {
          imgUrl = `/api/frames/${batch.session_id}/${batch.batch_id}/${batch.filenames[0]}`;
          isLive = true;
          try {
            jsonData = JSON.parse(batch.summary);
          } catch(e) {
            jsonData = batch.summary;
          }
        }

        const imgEl = document.getElementById('frameImage');
        const captionEl = document.getElementById('frameCaption');

        imgEl.src = imgUrl;
        imgEl.onload = () => {
          imgEl.style.display = 'block';
          document.getElementById('framePlaceholder').style.display = 'none';
        };

        if (isLive) {
          captionEl.textContent = `Egocentric Camera Capture Frame (1 of ${batch.filenames.length} in Batch)`;
        } else {
          captionEl.textContent = `Egocentric Camera Capture Frame (1 of 1 in Batch)`;
        }
        
        const codeEl = document.getElementById('jsonCode');
        if (typeof jsonData === 'object') {
          codeEl.textContent = JSON.stringify(jsonData, null, 2);
        } else {
          codeEl.textContent = jsonData;
        }

        if (!isLive) {
          const warn = document.createElement('div');
          warn.style.color = '#888';
          warn.style.fontSize = '0.7vw';
          warn.style.marginTop = '1vw';
          warn.style.fontStyle = 'italic';
          warn.textContent = "* Server memory empty. Showing representative sample.";
          document.querySelector('.content-area').parentElement.appendChild(warn);
        }
      })
      .catch(err => {
        // Silently use fallback on fetch error
        const imgEl = document.getElementById('frameImage');
        const captionEl = document.getElementById('frameCaption');

        imgEl.src = fallbackImgUrl;
        imgEl.onload = () => {
          imgEl.style.display = 'block';
          document.getElementById('framePlaceholder').style.display = 'none';
        };
        captionEl.textContent = `Egocentric Camera Capture Frame (1 of 1 in Batch)`;
        document.getElementById('jsonCode').textContent = JSON.stringify(fallbackJSON, null, 2);
      });
  </script>
</body>
</html>
